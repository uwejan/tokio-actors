[package]
name = "tokio-actors"
version = "0.13.0"
edition = "2021"
rust-version = "1.85"
description = "An OTP-style actor runtime for Rust: supervision, lifecycle and crash semantics traced to Erlang/OTP, with the known departures listed in the README"
license = "MIT OR Apache-2.0"
authors = ["Saddam Uwejan (Sam) <saddamuwejan@gmail.com>"]
repository = "https://github.com/uwejan/tokio-actors"
readme = "README.md"
homepage = "https://github.com/uwejan/tokio-actors"
documentation = "https://docs.rs/tokio-actors"
keywords = ["actors", "tokio", "otp", "supervision", "erlang"]
categories = ["asynchronous", "concurrency", "rust-patterns"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0.17"
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-util = "0.7"
futures-core = "0.3"
tokio-stream = "0.1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
dashmap = { version = "6", features = ["raw-api"] }
criterion = { version = "0.7.0", features = ["async_tokio"] }
tokio = { version = "1.53", features = ["test-util"] }

[[bench]]
name = "actor_bench"
harness = false

[[test]]
name = "abort_profile"
harness = false

[profile.test]
opt-level = 1
