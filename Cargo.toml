[package]
name = "tokio-actors"
version = "0.16.0"
edition = "2021"
rust-version = "1.85"
description = "An OTP-style actor runtime for Rust: supervision, lifecycle and crash semantics traced to Erlang/OTP, with the known departures listed in the README"
license = "MIT OR Apache-2.0"
authors = ["Saddam Uwejan (Sam) <saddamuwejan@gmail.com>"]
repository = "https://github.com/uwejan/tokio-actors"
readme = "README.md"
homepage = "https://github.com/uwejan/tokio-actors"
documentation = "https://docs.rs/tokio-actors"
keywords = ["actors", "tokio", "otp", "supervision", "erlang"]
categories = ["asynchronous", "concurrency", "rust-patterns"]
exclude = [".github/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["telemetry", "sys"]
telemetry = []
sys = []
tracing = ["dep:tracing"]

[dependencies]
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0.17"
tokio = { version = "1.53", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-util = "0.7"
futures-core = "0.3"
tokio-stream = "0.1"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
dashmap = { version = "6", features = ["raw-api"] }
criterion = { version = "0.7.0", features = ["async_tokio"] }
tokio = { version = "1.53", features = ["test-util"] }

[[bench]]
name = "actor_bench"
harness = false
required-features = ["telemetry"]

[[example]]
name = "app_tree"
required-features = ["telemetry"]

[[example]]
name = "flood_guard"
required-features = ["telemetry"]

[[example]]
name = "sys_telemetry"
required-features = ["telemetry", "sys"]

[[test]]
name = "abort_profile"
harness = false

# Tests build unoptimized, with line tables so a backtrace names its lines.
[profile.test]
debug = "line-tables-only"

# The explorer's configurations run on optimized code.
[profile.explore]
inherits = "test"
opt-level = 1
